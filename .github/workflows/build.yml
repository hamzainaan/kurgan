name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            cxx: g++
            tier: baseline
            verify: true
          - target: linux-x86_64-sse42
            cxx: g++
            tier: sse42
            verify: true
          - target: linux-x86_64-avx2
            cxx: g++
            tier: avx2
            verify: true
          - target: linux-x86_64-avx512
            cxx: g++
            tier: avx512
          - target: linux-arm64
            cxx: aarch64-linux-gnu-g++
            tier: baseline
            packages: g++-aarch64-linux-gnu
          - target: linux-arm64-neoverse
            cxx: aarch64-linux-gnu-g++
            tier: neoverse
            packages: g++-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: make VERSION=1 -j"$(nproc)" MODE=release TIER=${{ matrix.tier }} CXX=${{ matrix.cxx }} CXXFLAGS=-static
      - if: matrix.verify
        run: printf 'bench\nquit\n' | ./kurgan | grep -q "Nodes searched"
      - run: cp kurgan kurgan-${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: kurgan-${{ matrix.target }}
          path: kurgan-${{ matrix.target }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            tier: baseline
            verify: true
          - target: windows-x86_64-sse42
            tier: sse42
            verify: true
          - target: windows-x86_64-avx2
            tier: avx2
            verify: true
          - target: windows-x86_64-avx512
            tier: avx512
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: make VERSION=1 -j"$(nproc)" MODE=release TIER=${{ matrix.tier }} CXX=x86_64-w64-mingw32-g++ CXXFLAGS=-static
      - if: matrix.verify
        run: printf 'bench\nquit\n' | ./kurgan.exe | grep -q "Nodes searched"
      - run: cp kurgan.exe kurgan-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v6
        with:
          name: kurgan-${{ matrix.target }}
          path: kurgan-${{ matrix.target }}.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-universal
            tier: baseline
            lto: ''
            arch: -arch arm64 -arch x86_64
          - target: macos-arm64
            tier: apple
            lto: -flto
            arch: -arch arm64
    steps:
      - uses: actions/checkout@v5
      - run: make VERSION=1 -j"$(sysctl -n hw.ncpu)" MODE=release TIER=${{ matrix.tier }} LTO=${{ matrix.lto }} CXXFLAGS="${{ matrix.arch }} -mmacosx-version-min=11.0"
      - run: printf 'bench\nquit\n' | ./kurgan | grep -q "Nodes searched"
      - run: cp kurgan kurgan-${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: kurgan-${{ matrix.target }}
          path: kurgan-${{ matrix.target }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      NDK: 29.0.14206865
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm64-v8a
            abi: aarch64-linux-android
            api: 24
          - target: android-armeabi-v7a
            abi: armv7a-linux-androideabi
            api: 24
          - target: android-x86_64
            abi: x86_64-linux-android
            api: 24
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "ndk;$NDK"
      - run: |
          make VERSION=1 -j"$(nproc)" MODE=release TIER=baseline \
            CXX="$ANDROID_SDK_ROOT/ndk/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            CXXFLAGS="--target=${{ matrix.abi }}${{ matrix.api }} -static-libstdc++"
          cp kurgan kurgan-${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: kurgan-${{ matrix.target }}
          path: kurgan-${{ matrix.target }}
          if-no-files-found: error
